groups:
- neurodata_type_def: MotionSVDSeries
  neurodata_type_inc: TimeSeries
  doc: An extension of TimeSeries to include the motion SVD components.
  datasets:
  - name: data
    dtype: float
    shape:
    - null
    - null
    doc: The data values of the motion SVD temporal components.
          Must be 2D, where the first dimension must be time,
          the second dimension must be the number of components.
  - name: motion_masks
    neurodata_type_inc: DynamicTableRegion
    doc: References row(s) of MotionSVDMasks.
- neurodata_type_def: MotionSVDMasks
  neurodata_type_inc: DynamicTable
  doc: An extension of DynamicTable to include the motion SVD masks.
  datasets:
  - name: image_mask
    neurodata_type_inc: VectorData
    dtype: float
    shape:
    - null
    - null
    doc: motion SVD mask.
  - name: downsampling_factor
    dtype: float
    doc: Downsampling factor used to process the behavioural video.
  - name: mask_coordinates
    dtype: int
    shape:
    - 4
    doc: (x1, y1, x2, y2), Mask location in downsampled frame reference (top, right, bottom, left).
  - name: processed_frame_dimension
    dtype: int
    shape:
    - 2
    doc: The dimension of the processed frame [width, height].
  - name: singular_value
    neurodata_type_inc: VectorData
    dtype: float
    shape:
    - null
    doc: Singular value of each component, the square root of the motion variance
      the component explains.
    quantity: '?'
  - name: average_motion
    dtype: float
    shape:
    - null
    - null
    doc: Mean motion of each pixel, the image Facemap subtracts before the
      decomposition. Same shape as each image_mask, so image_mask weighted by the
      MotionSVDSeries data plus this image approximates the motion.
    quantity: '?'
  links:
  - name: source_video
    target_type: ImageSeries
    doc: The behavioral video the motion SVD was computed from.
    quantity: '?'
