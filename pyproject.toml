[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndx-facemap-motionsvd"
version = "0.2.0"
authors = [
    { name="Alessandra Trapani", email="alessandra.trapani@catalystneuro.com" },
]
description = "extension to store the motion SVD output from FaceMap software"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
]
keywords = [
    'NeurodataWithoutBorders',
    'NWB',
    'nwb-extension',
    'ndx-extension',
]
dependencies = [
    "pynwb>=3.0.0",  # 3.0.0 is the first release compatible with hdmf 4 and NumPy 2
    "hdmf>=4.0.0",  # 4.0.0 is the first release compatible with NumPy 2
]

[dependency-groups]
test = [
    "coverage>=7.5.4",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-subtests>=0.12.1",
    "python-dateutil>=2.8.2",
]

docs = [
    "hdmf-docutils>=0.4.7",
]

dev = [
    "black>=24.4.2",
    "codespell>=2.3.0",
    "pre-commit>=3.5.0",
    "ruff>=0.4.10",
    {include-group = "docs"},
    {include-group = "test"},
]

[project.urls]
"Homepage" = "https://github.com/catalystneuro/ndx-facemap-motionsvd"
"Bug Tracker" = "https://github.com/catalystneuro/ndx-facemap-motionsvd/issues"
"Changelog" = "https://github.com/catalystneuro/ndx-facemap-motionsvd/blob/main/CHANGELOG.md"

[tool.hatch.build]
include = [
    "src/pynwb",
    "spec/ndx-facemap-motionsvd.extensions.yaml",
    "spec/ndx-facemap-motionsvd.namespace.yaml",
]
exclude = [
    "src/pynwb/tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pynwb/ndx_facemap_motionsvd",
    "spec"
]

[tool.hatch.build.targets.wheel.sources]
"spec" = "ndx_facemap_motionsvd/spec"

[tool.hatch.build.targets.sdist]
include = [
    "src/pynwb",
    "spec/ndx-facemap-motionsvd.extensions.yaml",
    "spec/ndx-facemap-motionsvd.namespace.yaml",
    "docs",
]
exclude = []

[tool.pytest.ini_options]
# uncomment below to run pytest with code coverage reporting. NOTE: breakpoints may not work
# addopts = "--cov --cov-report html"

[tool.codespell]
skip = "htmlcov,.git,.mypy_cache,.pytest_cache,.coverage,*.pdf,*.svg,venvs,.tox,hdmf-common-schema,./docs/_build/*,*.ipynb"

[tool.coverage.run]
branch = true
source = ["ndx_facemap_motionsvd"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstract"
]

[tool.black]
line-length = 120
preview = true
exclude = ".git|.mypy_cache|.tox|.venv|venv|.ipynb_checkpoints|_build/|dist/|__pypackages__|.ipynb|docs/"

[tool.ruff]
lint.select = ["E", "F", "T100", "T201", "T203", "C901"]
exclude = [
  ".git",
  ".tox",
  "__pycache__",
  "build/",
  "dist/",
  "docs/source/conf.py",
]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/pynwb/ndx_facemap_motionsvd/__init__.py" = ["E402", "F401"]
"src/spec/create_extension_spec.py" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 17
